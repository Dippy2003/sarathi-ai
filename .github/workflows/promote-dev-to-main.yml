# .github/workflows/promote-dev-to-main.yml
#
# Paces the finished commits on `Dev` onto `main` over a fixed window
# (default 30 days), with a varied number of commits promoted per day
# instead of a flat daily count. Same forward-dated drip pattern used
# on repvision-yolo-pose and the Sinhala latent-language project.
#
# HOW IT WORKS
# - Each night the job counts commits that exist on Dev but not yet on
#   main, and how many days are left in the window.
# - It picks a randomized batch size around the average needed to
#   finish on time (so some days promote more, some fewer), then
#   fast-forwards main to that point on Dev. No merge commit is
#   created, so every commit keeps its original author and message
#   exactly as written on Dev.
# - On the last day of the window (or if it's ever behind schedule)
#   it promotes everything remaining, so the repo is always caught up
#   by END of the window regardless of variance on earlier days.
#
# SETUP — edit before first run:
# 1. Set START_DATE below to the date you want the drip to begin
#    (UTC, YYYY-MM-DD). TOTAL_DAYS defaults to 30.
# 2. Confirm branch names match your repo (`main` lowercase, `Dev` capital
#    D) — adjust the `git` commands below if different.
# 3. Make sure Dev already holds the full, rebased commit history you
#    want promoted (this workflow does not create commits, only moves
#    main forward through existing ones on Dev).
# 4. Requires Settings -> Actions -> General -> Workflow permissions
#    set to "Read and write permissions" so the default GITHUB_TOKEN
#    can push to main. If you add branch protection on main later,
#    this will need a PAT that can bypass it, or a PR+auto-merge step
#    instead of a direct push.

name: Promote Dev to main (paced release)

on:
  schedule:
    - cron: "30 1 * * *"   # nightly at 07:00 Sri Lanka time (UTC+5:30 = 01:30 UTC)
  workflow_dispatch: {}     # allows a manual run for testing

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Promote a paced batch of commits from Dev
        env:
          START_DATE: "2026-09-13"   # <-- EDIT: first day of the release window
          TOTAL_DAYS: "30"
        run: |
          set -euo pipefail

          git config user.name "Dippy2003"
          git config user.email "200962156+Dippy2003@users.noreply.github.com"

          git fetch origin main Dev

          remaining_commits=$(git rev-list --count origin/main..origin/Dev)
          if [ "$remaining_commits" -eq 0 ]; then
            echo "main is already up to date with Dev. Nothing to promote."
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)
          start_epoch=$(date -u -d "$START_DATE" +%s)
          today_epoch=$(date -u -d "$today" +%s)
          day_index=$(( (today_epoch - start_epoch) / 86400 + 1 ))

          if [ "$day_index" -lt 1 ]; then
            echo "Start date ($START_DATE) not reached yet. Skipping."
            exit 0
          fi

          remaining_days=$(( TOTAL_DAYS - day_index + 1 ))

          if [ "$remaining_days" -le 1 ]; then
            # Last day of the window, or past it: catch up fully.
            batch=$remaining_commits
          else
            avg=$(( (remaining_commits + remaining_days - 1) / remaining_days ))
            min=$(( avg / 2 ))
            [ "$min" -lt 1 ] && min=1
            max=$(( avg * 3 / 2 ))
            [ "$max" -gt "$remaining_commits" ] && max=$remaining_commits
            [ "$max" -lt "$min" ] && max=$min
            range=$(( max - min + 1 ))
            batch=$(( min + RANDOM % range ))
          fi

          echo "Day $day_index of $TOTAL_DAYS — $remaining_commits commits behind, promoting $batch today."

          target_sha=$(git rev-list --reverse origin/main..origin/Dev | sed -n "${batch}p")

          git checkout main
          git merge --ff-only "$target_sha"
          git push origin main

          echo "Promoted main to $target_sha."
